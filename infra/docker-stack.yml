version: "3.9"

# ==============================================================================
# AllSpark Fiscal — Stack Oficial de Produção / Alta Escala (Docker Swarm)
# Dimensionada para > 50.000 a 500.000+ notas fiscais/dia
# Uso: sh infra/swarm-deploy.sh  (ou: docker stack deploy -c infra/docker-stack.yml allspark-fiscal)
# ==============================================================================

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-common-env: &common-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: allspark
  DB_USER: allspark
  DB_PASSWORD_FILE: /run/secrets/allspark_db_password
  RABBIT_HOST: rabbitmq
  RABBIT_PORT: "5672"
  RABBIT_USER: allspark
  RABBIT_PASSWORD_FILE: /run/secrets/allspark_rabbit_password
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD_FILE: /run/secrets/allspark_redis_password
  ENGINE_URL: http://engine:9000
  ENGINE_TOKEN_FILE: /run/secrets/allspark_engine_token
  MASTER_KEY_FILE: /run/secrets/allspark_master_key
  ENABLE_ISSUANCE: "${ENABLE_ISSUANCE:-true}"
  ENABLE_PRODUCTION: "${ENABLE_PRODUCTION:-false}"
  STORAGE_DRIVER: "${STORAGE_DRIVER:-filesystem}"
  OBJECTS_DIR: /data/objects
  S3_ENDPOINT: "${S3_ENDPOINT:-}"
  S3_BUCKET: "${S3_BUCKET:-allspark-fiscal}"
  S3_REGION: "${S3_REGION:-us-east-1}"
  S3_TLS: "${S3_TLS:-true}"

services:
  # ----------------------------------------------------------------------------
  # 1. Camada de Dados e Mensageria (Stateful)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: allspark_owner
      POSTGRES_DB: allspark
      POSTGRES_PASSWORD_FILE: /run/secrets/allspark_db_admin_password
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "synchronous_commit=on"
    secrets:
      - source: allspark_db_admin_password
        target: allspark_db_admin_password
      - source: allspark_db_password
        target: db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks:
      - backend
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allspark_owner -d allspark"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *logging

  rabbitmq:
    image: rabbitmq:4.1-management
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'export RABBITMQ_DEFAULT_USER=allspark; export RABBITMQ_DEFAULT_PASS=$$(cat /run/secrets/allspark_rabbit_password); exec docker-entrypoint.sh rabbitmq-server'
    secrets:
      - allspark_rabbit_password
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *logging

  redis:
    image: redis:7.4-bookworm
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'exec redis-server --requirepass "$$(cat /run/secrets/allspark_redis_password)" --maxmemory 512mb --maxmemory-policy volatile-lru --appendonly yes --appendfsync everysec'
    secrets:
      - allspark_redis_password
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH=$$(cat /run/secrets/allspark_redis_password) redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 3s
      resources:
        limits:
          cpus: "1.0"
          memory: 640M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *logging

  # ----------------------------------------------------------------------------
  # 2. Job de Migração (One-shot no Deploy)
  # ----------------------------------------------------------------------------
  migrate:
    image: ${GHCR_REGISTRY:-ghcr.io/spoltec/allsparkfiscal}-api:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      ROLE: migrate
      DB_USER: allspark_owner
      DB_PASSWORD_FILE: /run/secrets/allspark_db_admin_password
      APP_PASSWORD_FILE: /run/secrets/allspark_db_password
    secrets:
      - allspark_db_admin_password
      - allspark_db_password
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
    logging: *logging

  # ----------------------------------------------------------------------------
  # 3. Motor Fiscal Interno (NFePHP v5.2.11 — Escalável Horizontalmente)
  # ----------------------------------------------------------------------------
  engine:
    image: ${GHCR_REGISTRY:-ghcr.io/spoltec/allsparkfiscal}-engine:${IMAGE_TAG:-latest}
    environment:
      ENGINE_TOKEN_FILE: /run/secrets/allspark_engine_token
      ICP_CA_FILE: /run/secrets/allspark_icp_ca
      NFE_SCHEMA: PL_010_V1.30
      ENABLE_ISSUANCE: "${ENABLE_ISSUANCE:-true}"
      ENABLE_PRODUCTION: "${ENABLE_PRODUCTION:-false}"
      ALLOW_TEST_CERTIFICATES: "false"
      PHP_CLI_SERVER_WORKERS: "8"
    secrets:
      - allspark_engine_token
      - allspark_icp_ca
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:9000/healthz') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      mode: replicated
      replicas: 4
      endpoint_mode: vip
      update_config:
        parallelism: 2
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 3s
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *logging

  # ----------------------------------------------------------------------------
  # 4. API HTTP Multi-Tenant (Recepção Rápida + Validação + Enfileiramento)
  # ----------------------------------------------------------------------------
  api:
    image: ${GHCR_REGISTRY:-ghcr.io/spoltec/allsparkfiscal}-api:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      ROLE: api
      DB_POOL_MAX: "25"
      TENANT_RATE_PER_SECOND: "${TENANT_RATE_PER_SECOND:-500}"
      MAX_PENDING_JOBS: "${MAX_PENDING_JOBS:-250000}"
    secrets:
      - allspark_db_password
      - allspark_master_key
      - allspark_engine_token
      - allspark_redis_password
    volumes:
      - objects_data:/data/objects:ro
    ports:
      - target: 8080
        published: 8088
        protocol: tcp
        mode: ingress
    networks:
      - backend
      - edge
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      mode: replicated
      replicas: 3
      endpoint_mode: vip
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 3s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *logging

  # ----------------------------------------------------------------------------
  # 5. Dispatcher Outbox -> RabbitMQ + Recuperador de Leases Expirados
  # ----------------------------------------------------------------------------
  dispatcher:
    image: ${GHCR_REGISTRY:-ghcr.io/spoltec/allsparkfiscal}-api:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      ROLE: dispatcher
      DB_POOL_MAX: "10"
    secrets:
      - allspark_db_password
      - allspark_rabbit_password
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      mode: replicated
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: any
        delay: 3s
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *logging

  # ----------------------------------------------------------------------------
  # 6. Workers Assíncronos de Emissão, Geração e Reconciliação SEFAZ
  # Escaláveis com `docker service scale allspark-fiscal_worker=12`
  # ----------------------------------------------------------------------------
  worker:
    image: ${GHCR_REGISTRY:-ghcr.io/spoltec/allsparkfiscal}-api:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      ROLE: worker
      DB_POOL_MAX: "12"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-8}"
    secrets:
      - allspark_db_password
      - allspark_rabbit_password
      - allspark_master_key
      - allspark_engine_token
      - allspark_redis_password
    volumes:
      - objects_data:/data/objects
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      mode: replicated
      replicas: 8
      update_config:
        parallelism: 2
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 3s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    logging: *logging

networks:
  backend:
    driver: overlay
    attachable: true
    internal: true
  egress:
    driver: overlay
    attachable: true
  edge:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  rabbit_data:
  redis_data:
  objects_data:

secrets:
  allspark_db_password:
    external: true
  allspark_db_admin_password:
    external: true
  allspark_rabbit_password:
    external: true
  allspark_redis_password:
    external: true
  allspark_engine_token:
    external: true
  allspark_master_key:
    external: true
  allspark_icp_ca:
    external: true

