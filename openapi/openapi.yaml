            "description": "Dependência indisponível",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          }
        }
      }
    },
    "/v1/documents/validate": {
      "post": {
        "summary": "Validar entrada sem persistir, assinar ou autorizar",
        "description": "Não valida XSD, certificado, cadastro SEFAZ ou habilitação fiscal. Não reserva número nem publica na fila.",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Resultado da operação",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "401": {
            "description": "Credencial inválida",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "403": {
            "description": "Scope insuficiente",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "404": {
            "description": "Recurso ausente ou de outro tenant",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "409": {
            "description": "Conflito",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "422": {
            "description": "Dados inválidos ou não suportados",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "429": {
            "description": "Limite de requisições/backpressure",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          },
          "503": {
            "description": "Dependência indisponível",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Envelope"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DocumentInput"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "description": "API key de tenant no bootstrap atual; não é OAuth2."
      }
    },
    "schemas": {
      "APIError": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "source": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          }
        },
        "required": [
          "code",
          "message",
          "source",
          "retryable"
        ]
      },
      "Envelope": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "data": {},
          "error": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/APIError"
              },
              {
                "type": "null"
              }
            ]
          },
          "request_id": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "data",
          "error",
          "request_id"
        ]
      },
      "Company": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "cnpj": {
            "type": "string",
            "pattern": "^[A-Z0-9]{12}[0-9]{2}$"
          },
          "name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 120
          },
          "uf": {
            "type": "string",
            "minLength": 2,
            "maxLength": 2
          },
          "ie": {
            "type": "string",
            "minLength": 2,
            "maxLength": 20
          },
          "crt": {
            "type": "integer",
            "minimum": 1,
            "maximum": 4
          },
          "address": {
            "$ref": "#/components/schemas/Address"
          }
        },
        "required": [
          "cnpj",
          "name",
          "uf",
          "ie",
          "crt",
          "address"
        ]
      },
      "CertificateUpload": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "pfx_base64": {
            "type": "string",
            "contentEncoding": "base64",
            "maxLength": 2097152
          },
          "password": {
            "type": "string",
            "maxLength": 1024
          },
          "csc": {
            "type": "string"
          },
          "csc_id": {
            "type": "string"
          }
        },
        "required": [
          "pfx_base64",
          "password"
        ]
      },
      "Address": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "street": {
            "type": "string"
          },
          "number": {
            "type": "string"
          },
          "district": {
            "type": "string"
          },
          "city_code": {
            "type": "string"
          },
          "city": {
            "type": "string"
          },
          "state": {
            "type": "string"
          },
          "postal_code": {
            "type": "string"
          }
        },
        "required": [
          "street",
          "number",
          "district",
          "city_code",
          "city",
          "state",
          "postal_code"
        ]
      },
      "Recipient": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "tax_id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "ie_indicator": {
            "type": "integer"
          },
          "ie": {
            "type": "string"
          },
          "address": {
            "$ref": "#/components/schemas/Address"
          }
        },
        "required": [
          "tax_id",
          "name",
          "ie_indicator",
          "address"
        ]
      },
      "Tax": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "cst": {
            "type": "string"
          },
          "csosn": {
            "type": "string"
          },
          "origin": {
            "type": "integer"
          },
          "base": {
            "type": "string",
            "pattern": "^[0-9]{1,12}(\\.[0-9]{1,10})?$"
          },
          "rate": {
            "type": "string",
            "pattern": "^[0-9]{1,12}(\\.[0-9]{1,10})?$"
          },
          "amount": {
            "type": "string",
            "pattern": "^[0-9]{1,12}(\\.[0-9]{1,10})?$"
          }
        },
        "required": []
      },
      "Taxes": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "icms": {
            "$ref": "#/components/schemas/Tax"
          },
          "pis": {
            "$ref": "#/components/schemas/Tax"
          },
          "cofins": {
            "$ref": "#/components/schemas/Tax"
          }
        },
        "required": [
          "icms",
          "pis",
          "cofins"
        ]
      },
      "Item": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "sku": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "ncm": {
            "type": "string"
          },
          "cfop": {
            "type": "string"
          },
          "gtin": {
            "type": "string"
          },
          "unit": {
            "type": "string"
          },
          "quantity": {
            "type": "string",
            "pattern": "^[0-9]{1,12}(\\.[0-9]{1,10})?$"
          },
          "unit_price": {
            "type": "string",
            "pattern": "^[0-9]{1,12}(\\.[0-9]{1,10})?$"
          },
          "total": {
            "type": "string",
            "pattern": "^[0-9]{1,12}(\\.[0-9]{1,10})?$"
          },
          "taxes": {
            "$ref": "#/components/schemas/Taxes"
          }
        },
        "required": [
          "sku",
          "description",
          "ncm",
          "cfop",
          "unit",
          "quantity",
          "unit_price",
          "total",
          "taxes"
        ]
      },
      "Payment": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "method": {
            "type": "string"
          },
          "amount": {
            "type": "string",
            "pattern": "^[0-9]{1,12}(\\.[0-9]{1,10})?$"
          }
        },
        "required": [
          "method",
          "amount"
        ]
      },
      "Invoice": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "nature": {
            "type": "string"
          },
          "direction": {
            "type": "integer",
            "enum": [
              0,
              1
            ]
          },
          "destination": {
            "type": "integer",
            "enum": [
              1,
              2,
              3
            ]
          },
          "city_code": {
            "type": "string"
          },
          "final_consumer": {
            "type": "boolean"
          },
          "presence": {
            "type": "integer"
          },
          "issuer_address": {
            "$ref": "#/components/schemas/Address",
            "description": "Legado: ignorado pelo worker; o endereço do emitente vem do cadastro da empresa."
          },
          "recipient": {
            "$ref": "#/components/schemas/Recipient"
          },
          "items": {
            "type": "array",
            "minItems": 1,
            "maxItems": 990,
            "items": {
              "$ref": "#/components/schemas/Item"
            }
          },
          "payments": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/Payment"
            }
          },
          "freight_mode": {
            "type": "integer"
          },
          "additional_info": {
            "type": "string"
          }
        },
        "required": [
          "nature",
          "direction",
          "destination",
          "city_code",
          "final_consumer",
          "presence",
          "recipient",
          "items",
          "payments",
          "freight_mode"
        ]
      },
      "DocumentInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "company_id": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string",
            "enum": [
              "nfe",
              "nfce"
            ]
          },
          "operation": {
            "type": "string",
            "enum": [
              "generate",
              "issue"
            ]
          },
          "environment": {
            "type": "string",
            "enum": [
              "homologation"
            ]
          },
          "series": {
            "type": "integer",
            "minimum": 0,
            "maximum": 889
          },
          "invoice": {
            "$ref": "#/components/schemas/Invoice"
          }
        },
        "required": [
          "company_id",
          "kind",
          "operation",
          "environment",
          "series",
          "invoice"
        ]
      },
      "BulkInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "documents": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "idempotency_key": {
                  "type": "string",
                  "minLength": 8,
                  "maxLength": 128
                },
                "document": {
                  "$ref": "#/components/schemas/DocumentInput"
                }
              },
              "required": [
                "idempotency_key",
                "document"
              ]
            }
          }
        },
        "required": [
          "documents"
        ]
      },
      "Artifact": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string"
          },
          "media_type": {
            "type": "string"
          },
          "sha256": {
            "type": "string"
          },
          "size": {
            "type": "integer"
          },
          "download_url": {
            "type": "string"
          }
        },
        "required": [
          "id",
          "kind",
          "media_type",
          "sha256",
          "size",
          "download_url"
        ]
      },
      "Document": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "company_id": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string"
          },
          "operation": {
            "type": "string"
          },
          "environment": {
            "type": "string"
          },
          "series": {
            "type": "integer"
          },
          "number": {
            "type": "integer",
            "description": "Synthetic number for generate; reserved fiscal sequence only for issue."
          },
          "status": {
            "type": "string",
            "enum": [
              "queued",
              "processing",
              "validated",
              "transmitting",
              "authorized",
              "rejected",
              "reconciliation_required",
              "failed"
            ]
          },
          "access_key": {
            "type": [
              "string",
              "null"
            ]
          },
          "result": {
            "type": "object"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "artifacts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Artifact"
            }
          }
        },
        "required": [
          "id",
          "company_id",
          "kind",
          "status",
          "result",
          "artifacts"
        ]
      },
      "CompanyPatch": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 120
          },
          "ie": {
            "type": "string",
            "minLength": 2,
            "maxLength": 20
          },
          "crt": {
            "type": "integer",
            "minimum": 1,
            "maximum": 4
          },
          "address": {
            "$ref": "#/components/schemas/Address"
          }
        },
        "required": []
      },
      "FiscalSettingsInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "environment": {
            "type": "string",
            "enum": [
              "homologation"
            ]
          },
          "series": {
            "type": "integer",
            "minimum": 0,
            "maximum": 889
          },
          "enabled": {
            "type": "boolean"
          }
        },
        "required": [
          "environment",
          "series",
          "enabled"
        ]
      }
    }
  }
}
